name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        task: [build, format-check, lint, analyze, test, sanitize]
    steps:
      - name: Install native toolchain
        run: pacman -Syu --noconfirm --needed git clang just jq libx11 libnm json-c
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain versions
        run: |
          cc --version
          clang --version
          clang-tidy --version
          clang-format --version
          just --version
      - name: Run ${{ matrix.task }}
        run: just ${{ matrix.task }}
      - name: Upload executable
        if: matrix.task == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: my-bar-linux-x86_64
          path: build/my-bar
          if-no-files-found: error
          retention-days: 14
